name: Keep Supabase Alive

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Project 1
        run: |
          curl --fail -X GET "${{ secrets.SUPABASE_URL_1 }}/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY_1 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY_1 }}"

      - name: Ping Supabase Project 2
        run: |
          curl --fail -X GET "${{ secrets.SUPABASE_URL_2 }}/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY_2 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY_2 }}"
